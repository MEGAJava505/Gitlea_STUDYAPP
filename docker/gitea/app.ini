# Local GitHub MVP - Gitea hardening configuration (PLAN_GITEA.md section 8.6).
#
# This is a headless, disposable instance for the validation harness. It is
# mounted read-only at /data/gitea/conf/app.ini. INSTALL_LOCK=true prevents the
# interactive installer; the admin user and API token are bootstrapped by the
# Compose command before `gitea web` starts.
#
# Hardening goals (section 8.6):
#   - disable self-registration
#   - disable organization creation by regular users
#   - disable self-service repository creation / public repositories
#   - disable the public users/explore pages
#   - disable Gitea Actions
#   - disable unneeded repository modules
# All educational repositories are private.

[server]
  PROTOCOL = http
  DOMAIN = localhost
  ROOT_URL = http://localhost:3000/
  HTTP_PORT = 3000
  SSH_PORT = 22
  SSH_LISTEN_PORT = 22
  DISABLE_SSH = false
  STATIC_ROOT_PATH =
  LFS_START_SERVER = false

[database]
  DB_TYPE = sqlite3
  # SQLite path lives inside the gitea-data named volume (under /data/gitea so
  # the s6 setup chown keeps it git-owned). The app's own SQLite file is a
  # separate file reached via DATABASE_URL (see .env.example / compose).
  PATH = /data/gitea/gitea.db
  LOG_SQL = false

[security]
  INSTALL_LOCK = true
  # Internal token is generated by Gitea at first boot if left empty.
  INTERNAL_TOKEN =
  PASSWORD_HASH_ALGO = pbkdf2

[service]
  # --- registration hardening ---
  DISABLE_REGISTRATION = true
  REGISTER_EMAIL_CONFIRM = false
  SHOW_REGISTRATION_BUTTON = false
  # Only signed-in users may view anything; nothing is publicly browsable.
  REQUIRE_SIGNIN_VIEW = true
  # New users cannot create organizations or public repos by default.
  DEFAULT_ALLOW_CREATE_ORGANIZATION = false
  DEFAULT_USER_IS_RESTRICTED = true
  DEFAULT_USER_VISIBILITY = restricted
  DEFAULT_EMAIL_NOTIFICATION_ENABLED = false
  DISABLE_FOOTER = true

[repository]
  # Force every repository to be private (section 8.6: all educational repos
  # are private). Users cannot create repos themselves (restricted), and the
  # creation limit is a belt-and-suspenders guard.
  FORCE_PRIVATE = true
  DEFAULT_PRIVATE = true
  MAX_CREATION_LIMIT = 1
  # Trim repository modules to what the product uses: code + issues + pulls.
  # repo.actions, repo.wiki, repo.projects, repo.packages are dropped.
  DEFAULT_REPO_UNITS = repo.code,repo.issues,repo.pulls
  DEFAULT_BRANCH = main
  # Git LFS and push-create are not used by the MVP.
  LFS_START_SERVER = false
  ENABLE_PUSH_CREATE_USER = false
  ENABLE_PUSH_CREATE_ORG = false

[pull-request]
  DEFAULT_MERGE_STYLE = merge
  # No automatic merge in the review flow (section 8.5).
  ENABLE_MERGE_SQUASH = false
  ENABLE_MERGE_REBASE = false
  ENABLE_MERGE_REBASE_WITHDRAW = false

[actions]
  # Gitea Actions are disabled (section 8.6).
  ENABLED = false

[actions_runner]
  # No runners registered.
  PROTOCOL = http
  INSECURE = false

[service.explore]
  # Disable the public explore pages (section 8.6).
  DISABLE_USERS_PAGE = true
  DISABLE_ORGANIZATIONS_PAGE = true
  DISABLE_CODE_PAGE = true
  DISABLE_STARS_PAGE = true

[session]
  PROVIDER = file
  FILE_PATH = /data/gitea/sessions
  GC_INTERVAL_TIME = 86400
  COOKIE = gitea

[log]
  MODE = file
  LEVEL = info
  ROOT = /data/gitea/log
  FILE_NAME = gitea.log

[cron]
  DISABLE_PRUNER = false
  SYSTEM_STATUS = true

[mailer]
  # The MVP harness does not send mail; the app has its own SMTP settings.
  ENABLED = false

[oauth2]
  # The validation app registers an OAuth2 client via the API at runtime; the
  # instance itself only acts as an OIDC provider for that client.
  TOKEN_SECURE_COOKIE = false
  REVERSE_PROXY_USER_HEADER =

[webhook]
  # Webhook delivery is managed by the app with verified signatures (section 16.1).
  ENABLED = true
  DELIVERY_TIMEOUT = 5
  ALLOWED_HOST_LIST =
  XWEBHOOK_URL =

[repository.pull-request]
  RESERVATION_DAYS = 0

[cron.archive_cleanup]
  RUN_AT_START = true
